<!DOCTYPE html>
<html>
    <head>
        <title>Fredrik Yngve</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="darkslategrey">
        <link rel="stylesheet" href="styles/style.css">
    </head>
    <body>
        <div id="history">
            <div>Welcome to yngve.me a site where you can get to know me(Fredrik Yngve) and what I have done so far in my career as a Software Engineer.</div>
            <div>Type <button type="button" class="cmd" data-command="help">'help'</button> to see available commands</div>
        </div>
        <form id="txtWrapper">
            <span id="prompt" class="prompt">guest@yngve.me ~&nbsp;</span>
            <input type="text" aria-label="Command" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" id="txtArea" autofocus/>
        </form>
        <nav id="shortcuts" aria-label="Commands">
            <button type="button" data-command="help">help</button>
            <button type="button" data-command="whois">whois</button>
            <button type="button" data-command="projects">projects</button>
            <button type="button" data-command="social">social</button>
            <button type="button" data-command="contact">contact</button>
            <button type="button" data-command="history">history</button>
            <button type="button" data-command="clear">clear</button>
        </nav>
        <script src="script.js"></script>
    </body>
</html>
